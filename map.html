<!DOCTYPE html>
<html>
<head>
    <title>Light pollution geojson map</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
    <script src="https://unpkg.com/leaflet.control.opacity@1.6.0/dist/L.Control.Opacity.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>

</head>
<body>
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #map {
            height: 100%;
            width: 100%;
        }

        .leaflet-control.integrated-opacity-control {
            background: transparent;
            border: none;
            box-shadow: none;
            margin: 0;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
            line-height: 1;
        }
        .leaflet-control.integrated-opacity-control .leaflet-control-layers-range {
            margin: 0;
        }
        .integrated-opacity-control .opacity-slider-container,
        .integrated-opacity-control table {
            width: 100% !important;
            margin: 0 !important;
        }
    </style>
    <div id="map"></div>
    <script>
        //TODO:
        // - Moar? https://www.weather.gov/gis/cloudgiswebservices
        // - Add color legends for enabled overlays

        const map = L.map('map', {
            center: [47.60, -122.34],
            zoom: 8,
        })
        
        // Base maps
        var ofmLiberty = L.maplibreGL({
            style: 'https://tiles.openfreemap.org/styles/liberty',
        }).addTo(map)
        var ofmFiord = L.maplibreGL({
            style: 'https://tiles.openfreemap.org/styles/fiord',
        })
        var ofmDark = L.maplibreGL({
            style: 'https://tiles.openfreemap.org/styles/dark',
        })

        var baseMaps = {
            "ofm.Liberty": ofmLiberty,
            "ofm.Fiord": ofmFiord,
            "ofm.Dark": ofmDark
        };

        // Overlay maps
        const infoLink = '<a href="https://djlorenz.github.io/astronomy/lp/" target="_blank">Light Pollution Atlas Information</a>';
        const lightpollution2025 = L.tileLayer(
            'https://djlorenz.github.io/astronomy/image_tiles/tiles2025/tile_{z}_{x}_{y}.png', {
                minZoom: 2,
                maxNativeZoom: 8,
                maxZoom: 19,
                tileSize: 1024,
                zoomOffset: -2,
                opacity: 0.4,
                errorTileUrl: 'https://djlorenz.github.io/astronomy/image_tiles/tiles2025/black.png'
            }).addTo(map)
            map.attributionControl.addAttribution(infoLink)

        // Order the smoke layers so density isn't obscured
        map.createPane('smoke_1').style.zIndex = 450;
        map.createPane('smoke_2').style.zIndex = 451;
        map.createPane('smoke_3').style.zIndex = 452;
        const noaaSmoke = L.esri.featureLayer({
            url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/NOAA_Satellite_Smoke_Detection_(v1)/FeatureServer/0", 
            style: (feature) => {
                let style = {
                    color: '#626b73',
                    opacity: 0.2,
                    fillOpacity: smokeFillOpacity,
                };
                if (feature.properties.Density === "Light") {
                    style.fillColor = "#6fee64";
                    style.pane="smoke_1";
                } else if (feature.properties.Density === "Medium") {
                    style.fillColor = "#cdfb46";
                    style.pane="smoke_2";
                } else if (feature.properties.Density === "Heavy") {
                    style.fillColor = "#d97c25";
                    style.pane="smoke_3";
                }

                return style;
            }
        })
        map.createPane('fire_1').style.zIndex = 460;
        map.createPane('fire_2').style.zIndex = 461;
        map.createPane('fire_3').style.zIndex = 462;
        map.createPane('fire_4').style.zIndex = 463;
        const noaaFire = L.esri.featureLayer({
            url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/NOAA_Satellite_Fire_Detections_(v1)/FeatureServer/0",
              pointToLayer: function (geojson, latlng) {
                return L.circleMarker(latlng, {
                    radius: 6,
                    fillColor: "#feb14c",
                    color: "#000",
                    weight: 1,
                });
            },
            style: (feature) => {
                let style = {
                    opacity: fireFillOpacity,
                    fillOpacity: fireFillOpacity,
                };
                if (feature.properties.FRP < 50) {
                    style.fillColor = "#feb14c";
                    style.pane = "fire_1";
                } else if (feature.properties.FRP < 150) {
                    style.fillColor = "#fc5029";
                    style.pane = "fire_2";
                } else if (feature.properties.FRP < 350) {
                    style.fillColor = "#e3191c";
                    style.pane = "fire_3";
                } else {
                    style.fillColor = "#b30024";
                    style.pane = "fire_4";
                }

                return style;
            }
        })
        map.createPane('aqi_1').style.zIndex = 460;
        map.createPane('aqi_2').style.zIndex = 461;
        map.createPane('aqi_3').style.zIndex = 462;
        map.createPane('aqi_4').style.zIndex = 463;
        map.createPane('aqi_5').style.zIndex = 464;
        map.createPane('aqi_6').style.zIndex = 465;
        const oneHourAgo = Math.floor(Date.now() / 1000) - 3600;
        const noaaAqi = L.esri.featureLayer({
            url: "https://services.arcgis.com/cJ9YHowT8TU7DUyn/ArcGIS/rest/services/AirNow24HrCombined/FeatureServer/0",
            where: `Unixtime >= ${oneHourAgo}`,
            style: (feature) => {
                let style = {
                    opacity: 0.2,
                    fillOpacity: aqiFillOpacity,
                };
                if (feature.properties.gridcode == 1) {
                    style.fillColor = "#00e400";
                    style.pane = "aqi_1";
                } else if (feature.properties.gridcode == 2) {
                    style.fillColor = "#ffff00";
                    style.pane = "aqi_2";
                } else if (feature.properties.gridcode == 3) {
                    style.fillColor = "#ff8000";
                    style.pane = "aqi_3";
                } else if (feature.properties.gridcode == 4) {
                    style.fillColor = "#ff0000";
                    style.pane = "aqi_4";
                } else if (feature.properties.gridcode == 5) {
                    style.fillColor = "#99004c";
                    style.pane = "aqi_5";
                } else if (feature.properties.gridcode == 6) {
                    style.fillColor = "#4c0026";
                    style.pane = "aqi_6";
                }
                return style;
            }
        })
        const weather = L.tileLayer.wms('https://opengeo.ncep.noaa.gov/geoserver/conus/conus_cref_qcd/ows?SERVICE=WMS&', {
                    layers: 'conus_cref_qcd',
                    transparent: true,
                    opacity: 0.6,
                    format: 'image/png' // needed for transparency
                })
        const clouds = L.tileLayer.wms('https://mapservices.weather.noaa.gov/geoserver/ndfd/sky/ows?SERVICE=WMS&', {
                    layers: 'sky',
                    transparent: true,
                    opacity: 0.6,
                    format: 'image/png'
                })

        // Hacky way to let the opacity plugin work on esri featureLayers
        const smokeFillOpacity = 0.3;
        const fireFillOpacity = 0.5
        const aqiFillOpacity = 0.3;
        noaaSmoke._url = 'feature';
        noaaFire._url = 'feature';
        noaaAqi._url = 'feature';
        noaaSmoke.setOpacity = function (opacity) {
            this.setStyle({
                fillOpacity: opacity,
                opacity: opacity
            });
        };
        noaaFire.setOpacity = function (opacity) {
            this.setStyle({
                fillOpacity: opacity,
                opacity: opacity
            });
        };
        noaaAqi.setOpacity = function (opacity) {
            this.setStyle({
                fillOpacity: opacity,
                opacity: opacity
            });
        };

        var overlays = {
            "Light": lightpollution2025,
            "Weather": weather,
            "Clouds": clouds,
            "Smoke": noaaSmoke,
            "Fires": noaaFire,
            "AQI": noaaAqi
        }

        // Layer toggles
        var layerControl = L.control.layers(baseMaps, overlays, {
            collapsed: true,
            position: 'topleft',
        }).addTo(map);

        // Opacity sliders
        var opacityControl = L.control.opacity(overlays, {
            position: 'bottomleft',
            collapsed: false
        }).addTo(map);

        // Move opacity control box into the layer control box
        setTimeout(function() {
            var opacityContainer = opacityControl.getContainer();
            var layersContainer = layerControl.getContainer();
            
            if (opacityContainer && layersContainer) {
                // Add new style class
                opacityContainer.classList.add('integrated-opacity-control');
                // Append into the collapsible list so they collapse together
                var layersList = layersContainer.querySelector('.leaflet-control-layers-list');
                layersList.appendChild(opacityContainer);
                // Add a separator
                opacityContainer.insertAdjacentHTML("beforebegin",'<div class="leaflet-control-layers-separator"></div>')
                // Prevent map dragging/clicking when interacting with the moved slider box
                L.DomEvent.disableClickPropagation(opacityContainer);
                L.DomEvent.disableScrollPropagation(opacityContainer);
            }
        }, 200);

        // Grab the geojson, decode it
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        let geodata = urlParams.get('data');
        if (geodata) {
            // un-urlsafe + pad
            const base64 = geodata
                .replace(/-/g, '+')
                .replace(/_/g, '/');
            while (base64.length % 4) {
                base64 += '=';
            }
            // Decode + un-gz
            const decompress = async base64string => {
                if (!('DecompressionStream' in window)) {
                    throw new Error('DecompressionStream is not supported by this browser');
                }
                const bytes = Uint8Array.from(atob(base64string), c => c.charCodeAt(0));
                const cs = new DecompressionStream('gzip');
                const writer = cs.writable.getWriter();
                writer.write(bytes).catch(() => {});
                writer.close().catch(() => {});
                const arrayBuffer = await new Response(cs.readable).arrayBuffer();
                return new TextDecoder().decode(arrayBuffer);
            }

            // Add a tooltip and click action
            function onEachFeature(feature, layer) {
                if (feature.properties) {
                    layer.bindTooltip(feature.properties.name + "<br> Sites: " + feature.properties.available);
                }
                layer.on({click: function(e){
                    window.open(e.target.feature.properties.url, "_blank")
                }})
            }

            // Add the geoJson layer as an overlay
            var geoLayer = null;
            decompress(base64).then( geoString => {
                geoLayer = L.geoJSON(JSON.parse(geoString), {
                    onEachFeature: onEachFeature
                })
                layerControl.addOverlay(geoLayer, "Campgrounds")
                geoLayer.addTo(map)
            })        
            .catch(err => console.error(err))
        }

    </script>
</body>
